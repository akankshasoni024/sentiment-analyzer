<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sentiment Analyzer 😄</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>🔍 Sentiment Analyzer</h1>
    <textarea id="textInput" placeholder="Type something and hit 'Analyze'..."></textarea>
    <button onclick="analyzeSentiment()">Analyze Sentiment</button>
    <div id="result"></div>
    <button id="showDetailsBtn" style="display:none;" onclick="openModal()">Show Details</button>
  </div>


  <!-- Modal -->
  <div id="detailsModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <h2>📊 Detailed Analysis</h2>
      <canvas id="sentimentChart" width="400" height="250"></canvas>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js"></script>
</body>
</html>
